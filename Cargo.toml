[package]
name = "devtunnel-service"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Run an existing persistent Microsoft Dev Tunnel as a Linux systemd user service"
license = "AGPL-3.0-only"
authors = ["Acture <acturea@gmail.com>"]
repository = "https://github.com/Acture/devtunnel-service"
keywords = ["devtunnel", "dev-tunnels", "systemd", "tunnel"]
categories = ["command-line-utilities", "network-programming"]
publish = false
# The Python implementation shares this tree until the Rust release replaces it.
include = ["/src/**/*.rs", "/tests/**/*.rs", "/README.md", "/LICENSE"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
# Microsoft publishes the Rust SDK only in this repository; the crates.io crate of
# the same name is a third-party upload. Pin a reviewed revision.
tunnels = { git = "https://github.com/microsoft/dev-tunnels", rev = "bb2a7dbdc56312b01b86be6eb8ce9cda7bb932a2", features = ["connections", "vendored-openssl"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
